[project]
name = "azure-test-engineering"
version = "0.1.0"
description = "AI-assisted Azure DevOps test engineering with LangChain RAG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.14.3",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.8",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "streamlit>=1.58.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=1.0.0",
]

[project.optional-dependencies]
documents = ["pypdf>=6.0.0", "python-docx>=1.2.0", "openpyxl>=3.1.5"]
